# Arranca la imagen de producción (Nginx) localmente. Para desarrollo diario use `pnpm dev`.
services:
  web:
    build: .
    image: inmo-mls-front:local
    ports:
      - '${WEB_PORT:-8080}:8080'
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_BASE_PATH: /v1
      PLATFORM_API_BASE_PATH: /plataforma/v1
      TENANT_CODE: ${TENANT_CODE:-co}
      # Nginx resuelve estos nombres solo por DNS (no por /etc/hosts). Si el backend corre
      # en el host, use la IP de la pasarela de Docker (p. ej. http://172.17.0.1:3000)
      # o ponga ambos servicios en la misma red y use el nombre del servicio.
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:3000}
      API_TENANT_HOST: ${API_TENANT_HOST:-co.api.localtest.me}
      PLATFORM_API_UPSTREAM: ${PLATFORM_API_UPSTREAM:-http://host.docker.internal:3000}
      PLATFORM_API_HOST: ${PLATFORM_API_HOST:-admin.api.localtest.me}
