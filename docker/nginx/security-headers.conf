# Se incluye en cada `location` que declara add_header (Nginx no hereda add_header entre niveles).
#
# style-src admite el hash de la cadena vacía: `input-otp` crea un <style> vacío y le añade las reglas
# por CSSOM (insertRule), que la CSP no restringe. Solo autoriza elementos <style> sin contenido, así
# que no permite estilos en línea ni 'unsafe-inline'. Lo verifica e2e/smoke.spec.ts (CA7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
