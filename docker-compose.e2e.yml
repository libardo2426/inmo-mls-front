# e2e local: docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm playwright
services:
  web:
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 2s
      timeout: 2s
      retries: 15

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      BASE_URL: http://web:8080
      CI: 'true'
    depends_on:
      web:
        condition: service_healthy
    command: npx playwright test -c e2e/playwright.config.ts
